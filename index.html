<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1816" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)" />
    <title>NEXORA</title>
    <meta
      name="description"
      content="NEXORA is a personal digital knowledge platform for news, books, study resources, knowledge articles, writing and ideas."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="canonical" href="https://shawonhaque.github.io/Nexora/" />
    <meta property="og:site_name" content="NEXORA" />
    <meta property="og:title" content="NEXORA" />
    <meta
      property="og:description"
      content="NEXORA is a personal digital knowledge platform for news, books, study resources, knowledge articles, writing and ideas."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shawonhaque.github.io/Nexora/" />
    <meta property="og:image" content="https://shawonhaque.github.io/Nexora/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEXORA" />
    <meta name="twitter:image" content="https://shawonhaque.github.io/Nexora/og-cover.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('nexora-theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
